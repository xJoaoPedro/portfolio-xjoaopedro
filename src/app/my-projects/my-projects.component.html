<section class="bg-white dark:bg-defdark flex flex-col h-[90vh] transition-colors duration-500">

    <h3 class="ps-12 my-24 font-bold text-3xl text-defdark dark:text-white">Estes são alguns projetos que refletem
        minhas skills:</h3>

    <div class="flex justify-center">

        <div
            class="group w-1/4 relative text-center h-fit bg-seclight dark:bg-secdark text-defdark dark:text-white font-bold m-12 p-2 transition-all duration-500 hover:scale-110">
            <img class="w-full" src="/public/images/psidaniela.png" alt="projeto psidaniela">
            <div
                class="absolute flex flex-col justify-center items-center w-full h-full top-0 left-0 bg-deflight70 dark:bg-defdark70">
                <p>Psicóloga Daniela Bezi</p>
                <button type="button" (click)="openModal(1)"
                    class="bg-defdark dark:bg-white py-2 px-4 hover:bg-defdark70 dark:hover:bg-deflight70 rounded-full opacity-0 invisible translate-y-24 transition-all duration-500 text-white dark:text-defdark    group-hover:opacity-100 group-hover:visible group-hover:translate-y-8"
                    data-toggle="modal" data-target="#modalPsicoDani">
                    Ver mais
                </button>
            </div>
        </div>

        <div
            class="group w-1/4 relative text-center h-fit bg-seclight dark:bg-secdark text-defdark dark:text-white font-bold m-12 p-2 transition-all duration-500 hover:scale-110">
            <img class="w-full" src="/public/images/petfriends.png" alt="projeto petfriends">
            <div
                class="absolute flex flex-col justify-center items-center w-full h-full top-0 left-0 bg-deflight70 dark:bg-defdark70">
                <p>Projeto Pet Friends Divina</p>
                <button type="button" (click)="openModal(2)"
                    class="bg-defdark dark:bg-white py-2 px-4 hover:bg-defdark70 dark:hover:bg-deflight70 rounded-full opacity-0 invisible translate-y-24 transition-all duration-500 text-white dark:text-defdark    group-hover:opacity-100 group-hover:visible group-hover:translate-y-8"
                    data-toggle="modal" data-target="#modalPetFriends">
                    Ver mais
                </button>
            </div>
        </div>

        <div
            class="group w-1/4 relative text-center h-fit bg-seclight dark:bg-secdark text-defdark dark:text-white font-bold m-12 p-2 transition-all duration-500 hover:scale-110">
            <img class="w-full" src="/public/images/pokecrud.png" alt="projeto petfriends">
            <div
                class="absolute flex flex-col justify-center items-center w-full h-full top-0 left-0 bg-deflight70 dark:bg-defdark70">
                <p>Pokémon CRUD</p>
                <button type="button" (click)="openModal(3)"
                    class="bg-defdark dark:bg-white py-2 px-4 hover:bg-defdark70 dark:hover:bg-deflight70 rounded-full opacity-0 invisible translate-y-24 transition-all duration-500 text-white dark:text-defdark    group-hover:opacity-100 group-hover:visible group-hover:translate-y-8"
                    data-toggle="modal" data-target="#modalPetFriends">
                    Ver mais
                </button>
            </div>
        </div>

    </div>



</section>
