<div class="flex justify-center items-center w-full h-screen bg-white">

    <div class="container mx-auto my-4 px-4 lg:px-20">

        <form (ngSubmit)="sendEmail(contactForm)" #contactForm="ngForm"
            class="w-full p-8 my-4 md:px-12 lg:w-9/12 lg:pl-20 lg:pr-40 mr-auto rounded-2xl shadow-2xl">
            <div class="flex">
                <h1 class="font-bold uppercase text-5xl">Mande um email</h1>
            </div>

            <div class="grid grid-cols-1 gap-5 md:grid-cols-2 mt-5">
                <input
                    class="w-full bg-gray-100 text-gray-900 mt-2 p-3 rounded-lg focus:outline-none focus:shadow-outline"
                    type="text" placeholder="Nome*" name="name" [(ngModel)]="formData.name" />
                <input
                    class="w-full bg-gray-100 text-gray-900 mt-2 p-3 rounded-lg focus:outline-none focus:shadow-outline"
                    type="number" placeholder="Telefone" name="phone" [(ngModel)]="formData.phone" />
                <input
                    class="w-full bg-gray-100 text-gray-900 mt-2 p-3 rounded-lg focus:outline-none focus:shadow-outline"
                    type="email" placeholder="Email*" id="fromEmail" name="from_email" ngModel required
                    [(ngModel)]="formData.from_email" />
                <input
                    class="w-full bg-gray-100 text-gray-900 mt-2 p-3 rounded-lg focus:outline-none focus:shadow-outline"
                    type="email" placeholder="Assunto*" id="subject" name="subject" ngModel required
                    [(ngModel)]="formData.subject" />
            </div>
            <div class="my-4">
                <textarea placeholder="Mensagem*"
                    class="w-full h-32 bg-gray-100 text-gray-900 mt-2 p-3 rounded-lg focus:outline-none focus:shadow-outline"
                    id="message" name="message" rows="5" ngModel required [(ngModel)]="formData.message"></textarea>
            </div>
            <div class="my-2 w-1/2 lg:w-1/4">
                <button class="cursor-pointer uppercase text-sm font-bold tracking-wide bg-blue-900 text-gray-100 p-3 rounded-lg w-full 
                      focus:outline-none focus:shadow-outline" type="submit" [disabled]="contactForm.invalid">
                    Enviar
                </button>
            </div>
        </form>

        <div class=" w-full lg:-mt-96 lg:w-2/6 px-8 py-12 ml-auto bg-blue-900 rounded-2xl">
            <div class="flex flex-col text-white">
                <h1 class="font-bold uppercase text-4xl my-4">Contatos</h1>
                <p class="text-gray-400">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam
                    tincidunt arcu diam
                </p>

                <div class="flex my-4 w-2/3 lg:w-1/2">
                    <div class="flex flex-col">
                        <i class="fas fa-map-marker-alt pt-2 pr-2"></i>
                    </div>
                    <div class="flex flex-col">
                        <h2 class="text-2xl">Main Office</h2>
                        <p class="text-gray-400">5555 Tailwind RD, Pleasant Grove, UT 73533</p>
                    </div>
                </div>

                <div class="flex my-4 w-2/3 lg:w-1/2">
                    <div class="flex flex-col">
                        <i class="fas fa-phone-alt pt-2 pr-2"></i>
                    </div>
                    <div class="flex flex-col">
                        <h2 class="text-2xl">Call Us</h2>
                        <p class="text-gray-400">Tel: xxx-xxx-xxx</p>
                        <p class="text-gray-400">Fax: xxx-xxx-xxx</p>
                    </div>
                </div>

                <div class="flex my-4 w-2/3 lg:w-1/2">
                    <a href="https://www.facebook.com/ENLIGHTENEERING/" target="_blank" rel="noreferrer"
                        class="rounded-full bg-white h-8 w-8 inline-block mx-1 text-center pt-1">
                        <i class="fab fa-facebook-f text-blue-900"></i>
                    </a>
                    <a href="https://www.linkedin.com/company/enlighteneering-inc-" target="_blank" rel="noreferrer"
                        class="rounded-full bg-white h-8 w-8 inline-block mx-1 text-center pt-1">
                        <i class="fab fa-linkedin-in text-blue-900"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

</div>
