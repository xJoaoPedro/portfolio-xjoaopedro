<section id="contacts"
    class="flex justify-center items-center w-full h-fit lg:h-[93vh] bg-white dark:bg-defdark transition-colors duration-500">

    <div class="container flex flex-col-reverse lg:flex-col mx-auto my-4 px-4 lg:px-20">

        <form (ngSubmit)="sendEmail(contactForm)" #contactForm="ngForm"
            class="transition-all duration-500 w-full p-8 my-4 md:px-12 lg:w-9/12 lg:pl-20 lg:pr-40 mr-auto rounded-2xl shadow-2xl bg-defdark dark:bg-white dark:shadow-unic">
            <div class="flex">
                <h1 class="font-bold uppercase text-5xl text-white dark:text-defdark">Mande um email</h1>
            </div>

            <div class="grid grid-cols-1 gap-5 md:grid-cols-2 mt-5">
                <!-- Nome -->
                <div>
                    <input
                        class="w-full bg-gray-100 dark:bg-gray-200 text-gray-900 dark:text-gray-800 mt-2 p-3 rounded-lg focus:shadow-outline hover:bg-gray-300 dark:hover:bg-gray-300 transition-colors duration-300"
                        type="text" placeholder="Nome*" name="name" [(ngModel)]="formData.name" #name="ngModel"
                        required />
                    <small class="text-red-500" *ngIf="name.invalid && name.touched">Nome é obrigatório.</small>
                </div>

                <!-- Telefone -->
                <div>
                    <input
                        class="w-full bg-gray-100 dark:bg-gray-200 text-gray-900 dark:text-gray-800 mt-2 p-3 rounded-lg focus:shadow-outline hover:bg-gray-300 dark:hover:bg-gray-300 transition-colors duration-300"
                        type="number" placeholder="Telefone" name="phone" [(ngModel)]="formData.phone"
                        #phone="ngModel" />
                </div>

                <!-- Email -->
                <div>
                    <input
                        class="w-full bg-gray-100 dark:bg-gray-200 text-gray-900 dark:text-gray-800 mt-2 p-3 rounded-lg focus:shadow-outline hover:bg-gray-300 dark:hover:bg-gray-300 transition-colors duration-300"
                        type="email" placeholder="Email*" id="fromEmail" name="from_email"
                        [(ngModel)]="formData.from_email" #fromEmail="ngModel" required email />
                    <small class="text-red-500"
                        *ngIf="fromEmail.errors && fromEmail.errors['required'] && fromEmail.touched">
                        Email é obrigatório.
                    </small>
                    <small class="text-red-500"
                        *ngIf="fromEmail.errors && fromEmail.errors['email'] && fromEmail.touched">
                        Email inválido.
                    </small>

                </div>

                <!-- Assunto -->
                <div>
                    <input
                        class="w-full bg-gray-100 dark:bg-gray-200 text-gray-900 dark:text-gray-800 mt-2 p-3 rounded-lg focus:shadow-outline hover:bg-gray-300 dark:hover:bg-gray-300 transition-colors duration-300"
                        type="text" placeholder="Assunto*" id="subject" name="subject" [(ngModel)]="formData.subject"
                        #subject="ngModel" required />
                    <small class="text-red-500" *ngIf="subject.invalid && subject.touched">Assunto é
                        obrigatório.</small>
                </div>
            </div>

            <!-- Mensagem -->
            <div class="my-4">
                <textarea placeholder="Mensagem*"
                    class="w-full h-32 bg-gray-100 dark:bg-gray-200 text-gray-900 dark:text-gray-800 mt-2 p-3 rounded-lg focus:shadow-outline hover:bg-gray-300 dark:hover:bg-gray-300 transition-colors duration-300"
                    id="message" name="message" rows="5" [(ngModel)]="formData.message" #message="ngModel"
                    required></textarea>
                <small class="text-red-500" *ngIf="message.invalid && message.touched">Mensagem é obrigatória.</small>
            </div>

            <div class="my-2 w-1/2 lg:w-1/4">
                <button
                    class="cursor-pointer uppercase text-sm font-bold tracking-wide bg-gray-300 text-defdark dark:text-white p-3 rounded-lg w-full
              focus:outline-none focus:shadow-outline dark:bg-gray-800 transition-all hover:scale-105 hover:-translate-x-0.5 hover:-translate-y-0.5 active:translate-x-0.5 active:translate-y-0.5"
                    type="submit" [disabled]="contactForm.invalid">
                    Enviar
                </button>
            </div>
        </form>
